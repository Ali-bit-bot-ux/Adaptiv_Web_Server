<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адаптив-AR | Экран ученика</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 md:p-8 flex justify-center min-h-screen items-start">
    
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col mt-4 md:mt-10 border-4 border-gray-800">
        
        <div class="bg-indigo-600 text-white p-6 text-center shadow-md z-10">
            <h1 class="text-2xl font-black tracking-wide">Адаптив-AR</h1>
            <p class="text-indigo-200 text-xs mt-1 uppercase font-semibold">Режим дополненной реальности</p>
        </div>

        <div class="p-8 flex-1 flex flex-col justify-center bg-gray-50" id="searchSection">
            <div class="text-center mb-8">
                <div class="text-6xl mb-4">📱</div>
                <h2 class="text-xl font-bold text-gray-700">Готовы к уроку?</h2>
                <p class="text-sm text-gray-500 mt-2">Введите код, который сгенерировал учитель.</p>
            </div>

            <input type="text" id="lessonIdInput" placeholder="ID урока (например: 123e45...)" 
                   class="w-full px-5 py-4 rounded-xl border-2 border-gray-200 focus:border-indigo-500 focus:ring-0 outline-none mb-4 text-center font-mono text-sm transition">
            
            <button onclick="loadLesson()" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl transition shadow-lg transform active:scale-95">
                Запустить 3D-среду
            </button>
            <p id="errorMsg" class="text-red-500 text-sm mt-4 hidden text-center font-medium bg-red-50 py-2 rounded-lg"></p>
        </div>

        <div id="arView" class="hidden flex-1 flex flex-col bg-gray-100 relative h-[80vh] overflow-y-auto">
            <div class="p-5 bg-white shadow-sm mb-2 sticky top-0 z-20">
                <h2 id="topicTitle" class="text-lg font-bold text-center text-indigo-900 leading-tight"></h2>
            </div>
            
            <div id="stepsContainer" class="p-4 flex-1"></div>

            <div class="p-4 bg-white border-t border-gray-200 sticky bottom-0">
                <button onclick="resetView()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 rounded-xl transition">
                    Завершить урок
                </button>
            </div>
        </div>
    </div>

    <script>
        async function loadLesson() {
            const lessonId = document.getElementById('lessonIdInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            
            if (!lessonId) {
                errorMsg.innerText = "Введите ID урока";
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');

            try {
                // Обращаемся к нашей базе данных через API
                const response = await fetch(`http://127.0.0.1:8000/api/lessons/${lessonId}`);
                
                if (!response.ok) throw new Error("Урок не найден");
                
                const data = await response.json();
                renderARView(data);

            } catch (error) {
                errorMsg.innerText = "Урок не найден. Проверьте правильность ID.";
                errorMsg.classList.remove('hidden');
            }
        }

        function renderARView(data) {
            document.getElementById('searchSection').classList.add('hidden');
            document.getElementById('arView').classList.remove('hidden');
            document.getElementById('topicTitle').innerText = data.topic;
            
            const container = document.getElementById('stepsContainer');
            container.innerHTML = '';

            data.steps.forEach(step => {
                const stepHtml = `
                    <div class="bg-white rounded-2xl p-5 mb-5 shadow-sm border border-gray-100 relative">
                        <div class="absolute -top-3 left-4 bg-indigo-600 text-white text-xs font-black px-3 py-1 rounded-full shadow-md">
                            ШАГ ${step.step_number}
                        </div>
                        
                        <h3 class="font-bold text-gray-800 text-md mt-2 mb-3">${step.title}</h3>
                        
                        <div class="bg-gray-900 text-white p-4 rounded-xl mb-4 shadow-inner relative overflow-hidden flex flex-col items-center justify-center min-h-[160px] border-2 border-indigo-900">
                            <div class="absolute inset-0 opacity-20" style="background-image: linear-gradient(#4f46e5 1px, transparent 1px), linear-gradient(90deg, #4f46e5 1px, transparent 1px); background-size: 20px 20px;"></div>
                            
                            <span class="absolute top-2 left-2 flex items-center text-[10px] text-red-400 uppercase tracking-widest font-mono font-bold">
                                <span class="w-2 h-2 rounded-full bg-red-500 mr-1 animate-pulse"></span> AR Active
                            </span>
                            
                            <span class="text-center text-lg md:text-xl font-medium z-10 text-green-300 drop-shadow-md">
                                ✨ ${step.ar_visual_element}
                            </span>
                        </div>
                        
                        <div class="flex items-start bg-indigo-50 p-3 rounded-lg border border-indigo-100">
                            <span class="text-xl mr-2">👨‍🏫</span>
                            <p class="text-xs text-indigo-900 leading-relaxed">
                                <strong>Тьютору:</strong> ${step.teacher_action}
                            </p>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', stepHtml);
            });
        }

        function resetView() {
            document.getElementById('searchSection').classList.remove('hidden');
            document.getElementById('arView').classList.add('hidden');
            document.getElementById('lessonIdInput').value = '';
        }
    </script>
</body>
</html>
