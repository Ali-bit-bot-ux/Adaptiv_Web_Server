<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адаптив-AR | Дашборд учителя</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-8">

    <div class="max-w-4xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-bold text-indigo-600 mb-2">Адаптив-AR</h1>
            <p class="text-gray-500">Генератор инклюзивных уроков для фиджитал-среды</p>
        </header>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-8">
            <h2 class="text-xl font-semibold mb-4">Создать новый урок</h2>
            <div class="flex gap-4">
                <input type="text" id="topicInput" placeholder="Например: Основы сложения до 5" 
                       class="flex-1 px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none transition">
                <button onclick="generateLesson()" id="generateBtn"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg font-medium transition flex items-center justify-center min-w-[160px]">
                    Сгенерировать
                </button>
            </div>
            <p id="loadingStatus" class="text-indigo-500 mt-4 hidden animate-pulse">✨ ИИ адаптирует программу, подождите...</p>
        </div>

        <div id="resultContainer" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">План урока</h2>
                <span id="lessonIdBadge" class="text-xs font-mono bg-gray-200 text-gray-600 px-3 py-1 rounded-full"></span>
            </div>
            <div id="stepsList" class="grid gap-6 md:grid-cols-3">
                </div>
        </div>
    </div>

    <script>
        async function generateLesson() {
            const topic = document.getElementById('topicInput').value;
            if (!topic) return alert("Введите тему урока!");

            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loadingStatus');
            const resultContainer = document.getElementById('resultContainer');
            const stepsList = document.getElementById('stepsList');

            // Меняем интерфейс на загрузку
            btn.disabled = true;
            btn.classList.add('opacity-50');
            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            stepsList.innerHTML = ''; // Очищаем старые результаты

            try {
                // Отправляем запрос на наш Python-сервер
                const response = await fetch('http://127.0.0.1:8000/api/lessons/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic: topic })
                });

                if (!response.ok) throw new Error("Ошибка сервера");
                
                const data = await response.json();

                // Показываем ID урока
                document.getElementById('lessonIdBadge').innerText = `ID: ${data.id}`;

                // Отрисовываем карточки шагов
                data.steps.forEach(step => {
                    const card = `
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 border-t-4 border-t-indigo-500 hover:shadow-md transition">
                            <span class="text-indigo-600 font-bold text-sm uppercase tracking-wide">Шаг ${step.step_number}</span>
                            <h3 class="text-lg font-bold mt-2 mb-3">${step.title}</h3>
                            <div class="mb-4">
                                <p class="text-xs text-gray-400 uppercase font-semibold mb-1">AR-Визуализация:</p>
                                <p class="text-sm bg-indigo-50 text-indigo-800 p-2 rounded">${step.ar_visual_element}</p>
                            </div>
                            <div>
                                <p class="text-xs text-gray-400 uppercase font-semibold mb-1">Действие учителя:</p>
                                <p class="text-sm text-gray-600">${step.teacher_action}</p>
                            </div>
                        </div>
                    `;
                    stepsList.insertAdjacentHTML('beforeend', card);
                });

                resultContainer.classList.remove('hidden');
            } catch (error) {
                alert("Произошла ошибка при генерации. Проверьте, запущен ли сервер.");
                console.error(error);
            } finally {
                // Возвращаем кнопку в исходное состояние
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
